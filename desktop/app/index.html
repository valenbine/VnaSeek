<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VNASeek Desktop Loader</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.88);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f8fafc;
        --muted: #b8c0d9;
        --accent: #65f7a6;
        --accent-2: #8b5cf6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(101, 247, 166, 0.14), transparent 28rem),
          radial-gradient(circle at 80% 0%, rgba(139, 92, 246, 0.24), transparent 24rem),
          linear-gradient(135deg, #020617 0%, var(--bg) 52%, #111827 100%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .loader-shell {
        width: min(560px, calc(100% - 32px));
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        padding: 32px;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 2.8rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .status {
        margin-top: 24px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        padding: 16px 18px;
      }

      .status strong {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
      }

      .meter {
        overflow: hidden;
        height: 10px;
        margin-top: 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .meter span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        animation: scan 1.9s ease-in-out infinite;
      }

      @keyframes scan {
        0%, 100% { transform: translateX(-22%); }
        50% { transform: translateX(110%); }
      }
    </style>
  </head>
  <body>
    <main class="loader-shell">
      <p class="eyebrow">Desktop Shell</p>
      <h1>VNASeek视频解析</h1>
      <p>桌面壳正在启动本地解析服务。服务就绪后，应用会自动跳转到正式界面。</p>

      <section class="status" aria-live="polite">
        <strong id="status-title">正在等待本地后端</strong>
        <p id="status-copy">正在连接 `http://127.0.0.1:5000/api/health`。</p>
      </section>

      <div class="meter" aria-hidden="true">
        <span></span>
      </div>
    </main>

    <script type="module" src="./loader.js"></script>
  </body>
  </html>
