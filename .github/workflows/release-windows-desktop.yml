name: Release Windows Desktop

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows-desktop:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        shell: pwsh
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_meta
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "release_tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
            "should_create=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "release_tag=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
            "should_create=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create release when triggered manually
        if: steps.release_meta.outputs.should_create == 'true'
        run: |
          $tag = "${{ steps.release_meta.outputs.release_tag }}"
          gh release view $tag --json tagName --jq .tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, skip create."
            exit 0
          }

          gh release create $tag --target "${{ github.sha }}" --title $tag --notes "Automated Windows desktop release for $tag"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Setup build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install desktop dependencies
        run: npm install

      - name: Generate desktop icons
        run: npm run desktop:icons

      - name: Prepare desktop resources
        run: npm run desktop:prepare

      - name: Install backend Python dependencies into bundle
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target ./resources/backend-deps -r ../beat_analyzer/requirements.txt

      - name: Download embedded Python runtime
        run: |
          $version = "3.11.9"
          $url = "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          if (Test-Path ./resources/python) {
            Remove-Item -Recurse -Force ./resources/python
          }
          Expand-Archive -Path $zipPath -DestinationPath ./resources/python

      - name: Verify bundled launcher files
        run: |
          if (!(Test-Path ./resources/launch_backend.py)) { throw "launch_backend.py missing" }
          if (!(Test-Path ./resources/backend/backend.py)) { throw "bundled backend.py missing" }
          if (!(Test-Path ./resources/python/python.exe)) { throw "embedded python missing" }
          if (!(Test-Path ./src-tauri/icons/icon.ico)) { throw "desktop icon missing" }

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Upload assets to GitHub release
        run: |
          $tag = "${{ steps.release_meta.outputs.release_tag }}"
          $files = Get-ChildItem -Path ./release -File -Recurse | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) {
            throw "No release files generated"
          }

          & gh release upload $tag $files --clobber
